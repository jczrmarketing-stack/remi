[project]
name = "nucleo"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "kokoro>=0.9.4",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "soundfile>=0.14.0",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

# kokoro, soundfile y sqlite_vec no traen tipos; el resto del núcleo sigue estricto.
[[tool.mypy.overrides]]
module = ["kokoro.*", "soundfile.*", "sqlite_vec.*"]
ignore_missing_imports = true
